<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Pro – Staff login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
 body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a1a4f,#1e5bff);padding:16px}
 .box{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:28px;box-shadow:0 25px 60px rgba(0,0,0,.4)}
 .box h1{font-size:1.15rem;font-weight:800;color:#0a1a4f}
 .btn-go{background:linear-gradient(135deg,#ffd83d,#ff8a1f);border:0;color:#0a1a4f;font-weight:800}
</style></head><body>
<form method="post" class="box">{% csrf_token %}
  <h1>SKILL PRO – Registrations</h1>
  <p class="text-muted small">Staff login required.</p>
  {% if form.errors %}<div class="alert alert-danger py-2 small">Wrong username or password.</div>{% endif %}
  <label class="form-label small fw-semibold">Username</label>
  <input name="username" class="form-control mb-3" autofocus autocomplete="username" required>
  <label class="form-label small fw-semibold">Password</label>
  <input name="password" type="password" class="form-control mb-3" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-go w-100 py-2">LOG IN</button>
</form></body></html>
